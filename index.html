<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CEREAL Data Products</title>
  <link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Syne:wght@700;800&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #f5f2eb;
      --ink: #1a1a18;
      --accent: #d64f2a;
      --muted: #9a9488;
      --rule: #c8c3b8;
    }

    body {
      background: var(--bg);
      color: var(--ink);
      font-family: 'DM Mono', monospace;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      border-bottom: 2px solid var(--ink);
      padding: 2rem 3rem;
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
    }

    .logo {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: 1.75rem;
      letter-spacing: -0.02em;
      line-height: 1;
    }

    .logo span {
      color: var(--accent);
    }

    .tagline {
      font-size: 0.75rem;
      color: var(--muted);
      letter-spacing: 0.08em;
      text-transform: uppercase;
    }

    nav {
      margin-left: auto;
      display: flex;
      gap: 2rem;
    }

    nav a {
      font-size: 0.75rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--muted);
      transition: color 0.15s;
    }

    nav a:hover { color: var(--ink); }

    main {
      flex: 1;
      padding: 6rem 3rem 4rem;
      max-width: 900px;
    }

    .eyebrow {
      font-size: 0.7rem;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.25rem;
    }

    h1 {
      font-family: 'Syne', sans-serif;
      font-weight: 800;
      font-size: clamp(2.5rem, 6vw, 4.5rem);
      line-height: 1.05;
      letter-spacing: -0.03em;
      margin-bottom: 2rem;
    }

    .divider {
      width: 3rem;
      height: 2px;
      background: var(--accent);
      margin-bottom: 2rem;
    }

    .description {
      font-size: 0.95rem;
      line-height: 1.8;
      color: var(--muted);
      max-width: 520px;
    }

    footer {
      border-top: 1px solid var(--rule);
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.7rem;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--muted);
    }
  </style>
</head>
<body>

  <header>
    <div class="logo">CEREAL<span>.</span></div>
    <div class="tagline">Data Products</div>
    <nav>
      <a href="#">About</a>
      <a href="#">Contact</a>
    </nav>
  </header>

  <main>
    <p class="eyebrow">Welcome</p>
    <h1>CEREAL<br>Data Products</h1>
    <div class="divider"></div>
    <p class="description">
      More content coming soon.
    </p>
  </main>

  <footer>
    <span>CEREAL Data Products</span>
    <span>&copy; 2026</span>
  </footer>

</body>
</html>
