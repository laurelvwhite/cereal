<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PSZ2G137.74-27.08 — CEREAL Data Products</title>
  <link href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #08050f;
      --ink: #ede8f5;
      --accent: #9b5de5;
      --accent2: #c77dff;
      --muted: #7a5fa0;
      --rule: #2a1a3a;
      --glow: rgba(155, 93, 229, 0.22);
    }

    body {
      background: var(--bg);
      background-image:
        radial-gradient(ellipse 80% 50% at 20% 80%, rgba(100, 30, 180, 0.22) 0%, transparent 70%),
        radial-gradient(ellipse 60% 40% at 80% 20%, rgba(180, 80, 255, 0.10) 0%, transparent 60%);
      color: var(--ink);
      font-family: 'EB Garamond', Georgia, serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    header {
      border-bottom: 1px solid var(--rule);
      padding: 2rem 3rem;
      display: flex;
      align-items: baseline;
      gap: 1.5rem;
    }

    .logo {
      font-family: 'EB Garamond', Georgia, serif;
      font-weight: 700;
      font-size: 1.75rem;
      letter-spacing: 0.06em;
      line-height: 1;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--ink);
    }

    .logo span { color: var(--accent); }

    nav {
      margin-left: auto;
      display: flex;
      gap: 2rem;
    }

    nav a {
      font-size: 0.8rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      text-decoration: none;
      color: var(--muted);
      transition: color 0.15s;
    }

    nav a:hover { color: var(--accent2); }
    nav a.active { color: var(--accent2); }

    main {
      flex: 1;
      padding: 6rem 3rem 4rem;
      max-width: 960px;
    }

    .eyebrow {
      font-size: 0.75rem;
      letter-spacing: 0.14em;
      text-transform: uppercase;
      color: var(--accent);
      margin-bottom: 1.25rem;
      font-style: italic;
    }

    h1 {
      font-family: 'EB Garamond', Georgia, serif;
      font-weight: 700;
      font-size: clamp(2rem, 4.5vw, 3.8rem);
      line-height: 1.05;
      letter-spacing: 0.02em;
      margin-bottom: 2rem;
      text-transform: uppercase;
    }

    .divider {
      width: 3rem;
      height: 1px;
      background: linear-gradient(90deg, var(--accent), var(--accent2));
      margin-bottom: 2rem;
      box-shadow: 0 0 8px var(--glow);
    }

    p {
      font-size: 1.15rem;
      line-height: 1.9;
      color: var(--ink);
      max-width: 860px;
      opacity: 0.85;
      margin-bottom: 1.5rem;
    }

    main a:link    { color: var(--accent2); text-decoration: underline; text-underline-offset: 3px; }
    main a:visited { color: #e0aaff; }
    main a:hover   { color: #fff; }

    footer {
      border-top: 1px solid var(--rule);
      padding: 1.5rem 3rem;
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      color: var(--muted);
      font-style: italic;
    }
  </style>
</head>
<body>

  <header>
    <a class="logo" href="../index.html">CEREAL<span>.</span></a>
    <nav>
      <a href="../index.html">Home</a>
      <a href="../about.html">About</a>
      <a href="../data.html" class="active">Data</a>
    </nav>
  </header>

  <main>
    <p class="eyebrow">Cluster</p>
    <h1>PSZ2G137.74-27.08</h1>
    <div class="divider"></div>
    <p>More info on PSZ2G137.74-27.08 coming soon.</p>
    <p><a href="../data.html">&larr; Back to Data</a></p>
  </main>

  <footer>
    <span>Laurel White</span>
    <span>&copy; 2026</span>
  </footer>

</body>
</html>
